services:
  postgres:
    # pgvector/pgvector:pg16 is a drop-in-compatible postgres:16 image with
    # the `vector` extension preinstalled (Art. XII §5's RAG literature
    # index -- see db/schema.sql's `CREATE EXTENSION IF NOT EXISTS vector`).
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexus_agent}
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for images, masks, embeddings, heatmaps
  # (Art. XII §8). Local stand-in for Phase 0/dev; a real deployment points
  # S3_ENDPOINT_URL at a managed S3-compatible service instead.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-nexus}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-nexus_dev_password}
    ports:
      - "${S3_PORT:-9000}:9000"
      - "9001:9001" # web console, dev convenience only
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:
