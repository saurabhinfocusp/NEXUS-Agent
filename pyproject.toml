[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-agent"
version = "0.1.0"
description = "NEXUS-Agent: Next-Generation Explainable Unified Spatial-Agent"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary]>=3.1",
    "redis>=5.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anndata>=0.10",
    "spatialdata>=0.2",
    # Phase 3 (Art. XII §2-3): Vision/Analyst model stack. torch/torchvision
    # are NOT listed here -- PyPI's default torch wheel bundles CUDA
    # runtime libs (~800MB+) even on a CPU-only machine; install them first
    # from the CPU-only wheel index (see environment.yml) so `pip install
    # -e .` afterward finds them already satisfied instead of pulling the
    # much larger default.
    "cellpose>=4.0",
    "scanpy>=1.10",
    "squidpy>=1.6",
    "s3fs",
    "tifffile",
    # Phase 4 (Art. XII §5): Critic/XAI attribution stack.
    "shap>=0.45",
    "sentence-transformers>=3.0",
    "scikit-learn>=1.4",
    "pgvector>=0.3",
    # Phase 5 (Art. XII §6): PEFT/LoRA fine-tuning loop; Phase 5 reviewer API.
    "peft>=0.11",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # webapp (upload-and-view frontend): scikit-image was already an
    # installed transitive dependency of cellpose -- made explicit here
    # since webapp/uploads.py imports it directly. python-multipart is
    # required by FastAPI for UploadFile/Form parsing and wasn't pulled in
    # by anything else.
    "scikit-image",
    "python-multipart>=0.0.9",
    # webapp expression-upload format support: anndata's `.loom` reader
    # needs loompy at call time but doesn't declare it as a hard dependency
    # itself. 10x Genomics `.h5`/mtx-bundle support needs no new dependency
    # -- scanpy (already required above) ships `read_10x_h5`/`read_10x_mtx`.
    "loompy>=3.0",
    # Biology (Enrichment) agent (Art. III §4): Enrichr/KEGG/Reactome/MSigDB
    # via gseapy, g:Profiler via gprofiler-official. STRING's interaction
    # network support uses a plain REST call (`requests`, already an
    # indirect dependency via other HTTP-using packages) -- no SDK needed.
    "gseapy>=1.1",
    "gprofiler-official>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires external services (Postgres/Redis/MinIO via docker compose) and/or network access to fetch model weights or benchmark datasets",
]
