name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast suite (no Docker, no model weights)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # CPU-only torch/torchvision FIRST, from PyTorch's CPU wheel index --
      # same ordering environment.yml enforces, so the editable install
      # below finds torch already satisfied instead of pulling PyPI's
      # CUDA-bundled default wheel.
      - name: Install CPU-only torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision

      - name: Install project
        run: pip install -e ".[dev]"

      - name: Run fast tests
        run: pytest tests/ -m "not integration" -q
